<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Lab Codes</title>
<style>
:root{--bg:#fff;--ink:#000;--ok:#1d8a4f}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#grid{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
button{padding:16px 0;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);font:600 18px system-ui,sans-serif;text-align:center;cursor:pointer}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.done{background:var(--ok);border-color:var(--ok);color:#fff}
</style>
</head>
<body>
<div id="grid"></div>
<script>
const E=[
{id:"1a",n:"1A",t:"Blink 2 LEDs alternately at a given duty cycle",p:"LED1 → 220Ω → pin 6, LED2 → 220Ω → pin 7, cathodes → GND",c:`void setup() {
  pinMode(6, OUTPUT);
  pinMode(7, OUTPUT);
}

void loop() {
  digitalWrite(6, HIGH);
  digitalWrite(7, LOW);
  delay(500);
  digitalWrite(7, HIGH);
  digitalWrite(6, LOW);
  delay(500);
}`},
{id:"1b",n:"1B",t:"LED ON/OFF using micro-switch, status on Serial Monitor",p:"LED → 220Ω → pin 7, switch → pin 5 (10kΩ pull-down to GND, other side to 5V)",c:`#define LED_PIN 7
#define MICROSWITCH_PIN 5

void setup() {
  pinMode(LED_PIN, OUTPUT);
  pinMode(MICROSWITCH_PIN, INPUT);
  Serial.begin(9600);
}

void loop() {
  if (digitalRead(MICROSWITCH_PIN) == HIGH) {
    digitalWrite(LED_PIN, HIGH);
    Serial.println(1);
  }
  else {
    digitalWrite(LED_PIN, LOW);
    Serial.println(0);
  }
}`},
{id:"1c",n:"1C",t:"LED ON/OFF only through Serial Monitor",p:"LED → 220Ω → pin 7. Type 1 for ON, 2 for OFF in the Serial Monitor",c:`void setup() {
  pinMode(7, OUTPUT);
  Serial.begin(9600);
  while (!Serial);
  Serial.println("Input 1 to Turn LED on and 2 to off");
}

void loop() {
  if (Serial.available()) {
    int state = Serial.parseInt();
    if (state == 1) {
      digitalWrite(7, HIGH);
      Serial.println("Command completed LED turned ON");
    }
    if (state == 2) {
      digitalWrite(7, LOW);
      Serial.println("Command completed LED turned OFF");
    }
  }
}`},
{id:"2a",n:"2A",t:"Auto fading of LED brightness through PWM",p:"LED → 220Ω → pin 9 (PWM pin)",c:`int led = 9;
int brightness = 0;
int fadeAmount = 5;

void setup() {
  pinMode(led, OUTPUT);
}

void loop() {
  analogWrite(led, brightness);
  brightness = brightness + fadeAmount;
  if (brightness == 0 || brightness == 125) {
    fadeAmount = -fadeAmount;
  }
  delay(200);
}`},
{id:"2b",n:"2B",t:"LED fading using potentiometer, POT value on Serial Monitor",p:"POT: ends → 5V and GND, wiper → A0. LED → 220Ω → pin 9",c:`int potPin = A0;
int gPin = 9;
int potVal;
float LEDVal;

void setup() {
  pinMode(potPin, INPUT);
  pinMode(gPin, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  potVal = analogRead(potPin);
  LEDVal = (255. / 1023.) * potVal;
  analogWrite(gPin, LEDVal);
  delay(500);
  Serial.println(LEDVal);
}`},
{id:"3a",n:"3A",t:"Traffic light simulation",p:"Red → 220Ω → pin 7, Yellow → 220Ω → pin 6, Green → 220Ω → pin 5. Note: the manual code uses pin 5 first, so it lights the green LED first",c:`void setup() {
  pinMode(5, OUTPUT);
  pinMode(6, OUTPUT);
  pinMode(7, OUTPUT);
}

void loop() {
  digitalWrite(5, HIGH);
  digitalWrite(6, LOW);
  digitalWrite(7, LOW);
  delay(4500);

  digitalWrite(5, LOW);
  digitalWrite(6, HIGH);
  digitalWrite(7, LOW);
  delay(2000);

  digitalWrite(5, LOW);
  digitalWrite(6, LOW);
  digitalWrite(7, HIGH);
  delay(2800);
}`},
{id:"3b",n:"3B",t:"4 LEDs chasing pattern back and forth",p:"4 LEDs → 220Ω each → pins 4, 5, 6, 7, cathodes → GND",c:`void setup() {
  pinMode(4, OUTPUT);
  pinMode(5, OUTPUT);
  pinMode(6, OUTPUT);
  pinMode(7, OUTPUT);
}

void loop() {
  digitalWrite(4, HIGH);
  delay(100);
  digitalWrite(5, HIGH);
  delay(100);
  digitalWrite(6, HIGH);
  delay(100);
  digitalWrite(7, HIGH);
  delay(100);
  digitalWrite(7, LOW);
  delay(100);
  digitalWrite(6, LOW);
  delay(100);
  digitalWrite(5, LOW);
  delay(100);
  digitalWrite(4, LOW);
  delay(100);
}`},
{id:"3c",n:"3C",t:"Decade UP/DOWN counter (4 LEDs as binary)",p:"LEDs → 220Ω → pins 2 (1), 3 (2), 4 (4), 5 (8), cathodes → GND. Compact version of the manual code: same output (1 to 9, reset, 9 to 1, reset)",c:`int pins[4] = {2, 3, 4, 5}; // bit0, bit1, bit2, bit3

void show(int n) {
  for (int b = 0; b < 4; b++) {
    digitalWrite(pins[b], (n >> b) & 1);
  }
  delay(1000);
}

void setup() {
  for (int b = 0; b < 4; b++) pinMode(pins[b], OUTPUT);
}

void loop() {
  for (int n = 1; n <= 9; n++) show(n); // UP count
  show(0);                              // reset
  for (int n = 9; n >= 1; n--) show(n); // DOWN count
  show(0);                              // reset
}`},
{id:"4",n:"4",t:"Obstacle detector using IR module with LED and buzzer",p:"IR: VCC → 5V, GND → GND, OUT → A0. Green LED → 220Ω → pin 7, Red LED + buzzer → 220Ω → pin 5",c:`void setup() {
  Serial.begin(9600);
  pinMode(5, OUTPUT);
  pinMode(7, OUTPUT);
}

void loop() {
  int v = analogRead(A0); // v means value
  Serial.println(v);
  delay(300);
  if (v < 260) {
    digitalWrite(7, LOW);
    digitalWrite(5, HIGH);
    delay(300);
    Serial.println("MOTION DETECTED");
    digitalWrite(5, LOW);
  }
  else {
    digitalWrite(5, LOW);
    digitalWrite(7, HIGH);
  }
}`},
{id:"5",n:"5",t:"Lamp control through relay using LDR module",p:"LDR module: VCC → 5V, GND → GND, AO → A0. LED/relay → pin 8 (LED via 220Ω)",c:`void setup() {
  pinMode(8, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  int a = analogRead(A0);
  Serial.println(a);
  if (a >= 400) {
    digitalWrite(8, HIGH);
    Serial.print("CLOUDY/EVENING SUN HAS SET");
  }
  else {
    digitalWrite(8, LOW);
    Serial.print("ENOUGH LIGHT/DAY TIME ");
  }
  delay(1000);
}`},
{id:"6",n:"6",t:"Distance measurement with reverse-parking warning (ultrasonic)",p:"HC-SR04: VCC → 5V, TRIG → pin 6, ECHO → pin 5, GND → GND. Buzzer and LED (via 220Ω) → pin 2",c:`const int trigPin = 6; // HC-SR04: VCC, TRIG, ECHO, GND
const int echoPin = 5;
const int buzzer = 2;
float new_delay;
long duration;
int distance;

void setup() {
  Serial.begin(9600);
  pinMode(trigPin, OUTPUT);
  pinMode(echoPin, INPUT);
  pinMode(buzzer, OUTPUT);
}

void loop() {
  digitalWrite(trigPin, LOW);
  delayMicroseconds(2);
  digitalWrite(trigPin, HIGH);
  delayMicroseconds(12);
  digitalWrite(trigPin, LOW);
  duration = pulseIn(echoPin, HIGH);
  distance = duration * 0.034 / 2;
  Serial.print("Distance: ");
  new_delay = (distance * 3) + 30;
  Serial.print(distance);
  Serial.println(" cm");
  if (distance < 50) {
    digitalWrite(buzzer, HIGH);
    delay(new_delay);
    digitalWrite(buzzer, LOW);
  }
  else {
    digitalWrite(buzzer, LOW);
  }
  delay(200);
}`},
{id:"7",n:"7",t:"Smoke detection with LED and buzzer (MQ2)",p:"MQ2: VCC → 5V, GND → GND, A0 → A0. Green LED → 220Ω → pin 11, Red LED + buzzer → 220Ω → pin 12",c:`int smoke;

void setup() {
  pinMode(11, OUTPUT);
  pinMode(12, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  smoke = analogRead(A0);
  Serial.println("Smoke Sensor");
  Serial.println(smoke);
  delay(1000);
  if (smoke > 250) {
    digitalWrite(11, LOW);
    digitalWrite(12, HIGH);
    delay(1000);
    digitalWrite(12, LOW);
    Serial.println("SMOKE DETECTED ");
  }
  else {
    digitalWrite(11, HIGH);
    digitalWrite(12, LOW);
    Serial.println("NO SMOKE ");
  }
}`},
{id:"8",n:"8",t:"Name, USN and college on I2C LCD",p:"LCD I2C: VCC → 5V, GND → GND, SDA → A4, SCL → A5. Library: LiquidCrystal_I2C. Fixed to a 16x2 display and prints once per line instead of repeating in loop()",c:`#include <Wire.h>
#include <LiquidCrystal_I2C.h>

LiquidCrystal_I2C lcd(0x27, 16, 2); // SDA = A4, SCL = A5

void setup() {
  Serial.begin(9600);
  lcd.init();
  lcd.backlight();
  lcd.setCursor(0, 0);
  lcd.print("JACOB S E");        // Name
  lcd.setCursor(0, 1);
  lcd.print("1MJ22CS014 MVJ CSE"); // USN + college/dept (scrolls if > 16 chars)
}

void loop() {
  // static display, nothing to repeat
}`},
{id:"8b",n:"8B",t:"POT value and angle on LCD and Serial Monitor",p:"POT wiper → A0 (ends to 5V and GND). LCD I2C: SDA → A4, SCL → A5",c:`#include <Wire.h>
#include <LiquidCrystal_I2C.h>

// I2C address (usually 0x27) and size (16x2)
LiquidCrystal_I2C lcd(0x27, 16, 2);

int potValue;  // potentiometer reading
float angle;   // calculated angle in degrees

void setup() {
  Serial.begin(9600);
  lcd.init();
  lcd.backlight();
}

void loop() {
  potValue = analogRead(A0);
  // Convert to angle (0 to 315 degrees)
  angle = (float)potValue * 315.0 / 1023.0;

  // Serial Monitor
  Serial.print("Potentiometer value: ");
  Serial.println(potValue);
  Serial.print("Angle: ");
  Serial.print(angle);
  Serial.println(" degrees");

  // LCD
  lcd.clear();
  lcd.setCursor(0, 0);
  lcd.print("Pot Val:");
  lcd.print(potValue);
  lcd.setCursor(0, 1);
  lcd.print("Angle:");
  lcd.print(angle, 1);      // 1 decimal place
  lcd.print((char)223);     // degree symbol
  delay(500);
}`},
{id:"9",n:"9",t:"Temperature and humidity on I2C LCD (DHT11)",p:"DHT11 data → pin 8, VCC → 5V, GND → GND. LCD: SDA → A4, SCL → A5. Install \"DHT sensor library\" by Adafruit",c:`#include <DHT.h>
#include <LiquidCrystal_I2C.h>
#include <Wire.h>

LiquidCrystal_I2C lcd(0x27, 16, 2); // SDA = A4, SCL = A5

#define DHTPIN 8      // data pin
#define DHTTYPE DHT11 // DHT 11
DHT dht(DHTPIN, DHTTYPE);

int h; // humidity
int t; // temperature

void setup() {
  Serial.begin(9600);
  Serial.println("Temperature and Humidity Sensor Test");
  dht.begin();
  lcd.init();
  lcd.backlight();
}

void loop() {
  h = dht.readHumidity();
  t = dht.readTemperature();

  Serial.print("Humidity: ");
  Serial.print(h);
  Serial.print(" %, Temp: ");
  Serial.print(t);
  Serial.println(" Celsius");

  lcd.setCursor(0, 0);
  lcd.print(" Now Temperature ");
  lcd.setCursor(0, 1);
  lcd.print("T:");
  lcd.print(t);
  lcd.print("C");
  lcd.setCursor(6, 1);
  lcd.print("2025 ");
  lcd.setCursor(11, 1);
  lcd.print("H:");
  lcd.print(h);
  lcd.print("%");
  delay(1000);
}`},
{id:"10",n:"10",t:"Soil moisture: automatic sprinkler (dry, moist, fully wet)",p:"Soil sensor module: VCC → 5V, GND → GND, A0 → A0. LEDs → 220Ω: Red (dry) → pin 2, Yellow (moist) → pin 3, Green (wet) → pin 4. Added a last else for readings between the ranges",c:`int sensor_pin = A0; // soil sensor: A0, D0, GND, VCC

void setup() {
  Serial.begin(9600);
  pinMode(sensor_pin, INPUT);
  pinMode(2, OUTPUT);
  pinMode(3, OUTPUT);
  pinMode(4, OUTPUT);
}

void loop() {
  int sensor_data = analogRead(sensor_pin);
  Serial.println(sensor_data);

  if (sensor_data >= 1000) {
    digitalWrite(2, HIGH);
    digitalWrite(3, LOW);
    digitalWrite(4, LOW);
    Serial.println("No moisture Soil is dry");
    delay(1000);
  }
  else if (sensor_data <= 700 && sensor_data >= 630) {
    digitalWrite(2, LOW);
    digitalWrite(3, HIGH);
    digitalWrite(4, LOW);
    Serial.println("There is some moisture, Soil is medium");
    delay(1000);
  }
  else if (sensor_data <= 600) {
    digitalWrite(2, LOW);
    digitalWrite(3, LOW);
    digitalWrite(4, HIGH);
    Serial.println("Soil is wet");
    delay(1000);
  }
  else {
    Serial.println("Moisture level in between, reading again");
    delay(1000);
  }
}`}
];


const g=document.getElementById('grid');
E.forEach(e=>{
  const b=document.createElement('button');b.type='button';
  b.textContent=e.n;b.setAttribute('aria-label','Copy code for experiment '+e.n);
  b.onclick=async()=>{
    try{await navigator.clipboard.writeText(e.c)}catch(_){
      const t=document.createElement('textarea');t.value=e.c;document.body.appendChild(t);t.select();
      try{document.execCommand('copy')}catch(__){}t.remove();
    }
    b.textContent='Copied';b.classList.add('done');
    setTimeout(()=>{b.textContent=e.n;b.classList.remove('done')},1200);
  };
  g.appendChild(b);
});
</script>
</body>
