<title>IoT Lab Codes</title>
<style>
:root{--bg:#fff;--ink:#000;--ok:#1d8a4f}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff}}
*{box-sizing:border-box}
body{margin:0;padding:20px 14px;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px}
button.copy{flex:0 0 84px;padding:18px 0;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);font:600 20px system-ui,sans-serif;cursor:pointer}
button.copy:hover{background:var(--ink);color:var(--bg)}
button.copy:focus-visible,.pic:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.copy.done{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px}
.pic{flex:1 1 0;min-width:0;padding:0;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:zoom-in;overflow:hidden;line-height:0}
.pic img{width:100%;max-height:220px;object-fit:contain;display:block}
.none{flex:1 1 0;color:var(--ink);opacity:.55;font-size:14px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:12px;z-index:9;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
</style>
</head>

const list=document.getElementById('list'),lb=document.getElementById('lb'),lbi=lb.querySelector('img');
E.forEach(e=>{
  const r=document.createElement('div');r.className='row';
  const b=document.createElement('button');b.type='button';b.className='copy';b.textContent=e.n;
  b.setAttribute('aria-label','Copy code for experiment '+e.n);
  b.onclick=async()=>{
    try{await navigator.clipboard.writeText(e.c)}catch(_){
      const t=document.createElement('textarea');t.value=e.c;document.body.appendChild(t);t.select();
      try{document.execCommand('copy')}catch(__){}t.remove();
    }
    b.textContent='Copied';b.classList.add('done');
    setTimeout(()=>{b.textContent=e.n;b.classList.remove('done')},1200);
  };
  r.appendChild(b);
  if(e.i){
    const p=document.createElement('button');p.type='button';p.className='pic';
    p.setAttribute('aria-label','Enlarge circuit picture for '+e.n);
    p.innerHTML='<img alt="Circuit diagram for experiment '+e.n+'" src="'+e.i+'">';
    p.onclick=()=>{lbi.src=e.i;lb.classList.add('on')};
    r.appendChild(p);
  }else{
    const n=document.createElement('div');n.className='none';n.textContent='No picture in the manual';r.appendChild(n);
  }
  list.appendChild(r);
});
lb.onclick=()=>lb.classList.remove('on');
