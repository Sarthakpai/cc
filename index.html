1. For  a  given  set  of  training  data  examples  stored  in  a  .CSV file,  implement  and demonstrate  the  Candidate-Elimination       algorithm    to  output  a  description  of  the  set  of  all hypotheses Consistent  with  the  training  examples.



import numpy as np
import pandas as pd

data = pd.DataFrame(data=pd.read_csv('/home/user/Documents/trainingdata.csv'))
print(data)
concepts = np.array(data.iloc[:,0:-1])
print(concepts)

target = np.array(data.iloc[:,-1])
print(target)
def learn(concepts, target):
   
    specific_h = concepts[0].copy()
    print("\nInitialization of specific_h and general_h")
    print(specific_h)
    
    general_h = [["?" for i in range(len(specific_h))] for i in range(len(specific_h))]
    print(general_h)
    for i, h in enumerate(concepts):
        if target[i] == "Yes":
            for x in range(len(specific_h)):
                if h[x] != specific_h[x]:
                    specific_h[x] = '?'
                    general_h[x][x] = '?'

        if target[i] == "No":
            for x in range(len(specific_h)):
                
                if h[x] != specific_h[x]:
                    general_h[x][x] = specific_h[x]
                else:
                    general_h[x][x] = '?'

        print("\nSteps of Candidate Elimination Algorithm",i+1)
        print(specific_h)
        print(general_h)
    
    indices = [i for i, val in enumerate(general_h) if val == ['?', '?', '?', '?', '?', '?']]
    for i in indices:
        
        general_h.remove(['?', '?', '?', '?', '?', '?'])
   
    return specific_h, general_h
s_final, g_final = learn(concepts, target)
print("\nFinal Specific_h:", s_final, sep="\n")
print("\nFinal General_h:", g_final, sep="\n")

2. Implement A* Search algorithm.


import heapq
GRID_SIZE = 10
grid = [[0 for _ in range(GRID_SIZE)] for _ in range(GRID_SIZE)]
start = (0, 0)
goal = (GRID_SIZE - 1, GRID_SIZE - 1)
def heuristic(node, goal):
    return abs(node[0] - goal[0]) + abs(node[1] - goal[1])

def astar(grid, start, goal):
    open_list = []
    closed_list = set()

    cost = {start: 0}
    prev_node = {start: None}
    heapq.heappush(open_list, (0, start))

    while open_list:
        current_cost, current_node = heapq.heappop(open_list)

        if current_node == goal:
            path = []
            while current_node is not None:
                path.append(current_node)
                current_node = prev_node[current_node]
            return path[::-1]
        closed_list.add(current_node)
        for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
            neighbor = (current_node[0] + dx, current_node[1] + dy)
            if 0 <= neighbor[0] < GRID_SIZE and 0 <= neighbor[1] < GRID_SIZE:
                if grid[neighbor[0]][neighbor[1]] == 0 and neighbor not in closed_list:
                    neighbor_cost = cost[current_node] + 1

                    if neighbor not in cost or neighbor_cost < cost[neighbor]:
                        cost[neighbor] = neighbor_cost
                        prev_node[neighbor] = current_node
                        heapq.heappush(open_list, (neighbor_cost + heuristic(neighbor, goal), neighbor))

    return None
path = astar(grid, start, goal)

if path is not None:
    print("Path found:", path)
else:
 print("No path found")

# Sigmoid Function
def sigmoid(x):
    return 1 / (1 + np.exp(-x))

def derivatives_sigmoid(x):
    return x * (1 - x)

epoch = 5000  
lr = 0.1  
inputlayer_neurons = 2  
hiddenlayer_neurons = 3  
output_neurons = 1  
wh = np.random.uniform(size=(inputlayer_neurons, hiddenlayer_neurons))
bh = np.random.uniform(size=(1, hiddenlayer_neurons))
wout = np.random.uniform(size=(hiddenlayer_neurons, output_neurons))
bout = np.random.uniform(size=(1, output_neurons))

for i in range(epoch):
   
    hinp1 = np.dot(X, wh)
    hinp = hinp1 + bh
    hlayer_act = sigmoid(hinp)
    outinp1 = np.dot(hlayer_act, wout)
    outinp = outinp1 + bout
    output = sigmoid(outinp)
    
    EO = y - output

    d_output = EO * outgrad
    EH = d_output.dot(wout.T)

    d_hiddenlayer = EH * hiddengrad
    wout += hlayer_act.T.dot(d_output) * lr  
    wh += X.T.dot(d_hiddenlayer) * lr

package com.mvjce.prgm6.entity;
import org.hibernate.Session;
import com.mvjce.prgm6.util.HibernateUtil;
public class StudentManager {
public void insertStudent(Student1 student) {

try (Session session = HibernateUtil.getSession()) {
session.beginTransaction();
session.persist(student);
session.getTransaction().commit();
}
}
public Student1 searchStudentById(int id) {
try (Session session = HibernateUtil.getSession()) {
return session.get(Student1.class, id);
}
}
public void updateStudentAge(int id, int newAge) {
try (Session session = HibernateUtil.getSession()) {
session.beginTransaction();
Student1 student = session.get(Student1.class, id);
if (student != null) {
student.setAge(newAge);
session.merge(student);
session.getTransaction().commit();
}
}
}
public void deleteStudent(int id) {
try (Session session = HibernateUtil.getSession()) {
session.beginTransaction();
Student1 student = session.get(Student1.class, id);
if (student != null) {
session.remove(student);
session.getTransaction().commit();
}
}
}
}

 Demonstrate using Spring Boot: Complete the docker setup on your Sandbox.
− Download a docker image from Docker Hub and deploy the same on your docker
server
− Build a sample custom image for any of the App of your choice and run the app
image as a container

Step 1: Install Docker
If you haven't already, install Docker on your sandbox environment. You can download the Docker installer
from the official Docker website.

Step 2: Pull a Docker Image from Docker Hub
Open a terminal and run the following command to pull the official MySQL Docker image from Docker Hub:
docker pull mysql:latest
This will download the latest MySQL Docker image from Docker Hub.

Step 3: Run the MySQL Container
Run the following command to start a new container from the MySQL image:
docker run -d --name mysql-server -e MYSQL_ROOT_PASSWORD=password -p 3306:3306 mysql:latest
This will start a new container named "mysql-server" and map port 3306 on the host machine to port 3306 in
the container.

Step 4: Create a Spring Boot Application
Create a new Spring Boot application using your preferred method, such as using Spring Initializr or manually
creating the project structure.

Step 5: Create a Dockerfile
Create a new file named "Dockerfile" in the root directory of your Spring Boot project. Add the following
contents to the file:
FROM openjdk:8-jdk-alpine
ARG JAR_FILE=target/*.jar
COPY ${JAR_FILE} app.jar
ENTRYPOINT ["java","-jar","/app.jar"]
This Dockerfile uses the official OpenJDK 8 image as a base, copies the Spring Boot application JAR file into
the container, and sets the entrypoint to run the JAR file using Java.

Step 6: Build the Docker Image
Run the following command to build the Docker image:
docker build -t my-spring-boot-app .
This will create a new Docker image with the name "my-spring-boot-app".

Step 7: Run the Docker Container
Run the following command to start a new container from the "my-spring-boot-app" image:
docker run -d --name my-spring-boot-app -p 8080:8080 my-spring-boot-app
This will start a new container named "my-spring-boot-app" and map port 8080 on the host machine to port
8080 in the container.

Step 8: Verify the Application
Open a web browser and navigate to http://localhost:8080 to verify that the Spring Boot application is running
correctly.

That's it! You have now demonstrated the use of Docker with Spring Boot by building a custom Docker image
and running it as a container
